[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "poolside-home-assistant"
version = "0.1.33"
description = "Safety-first Home Assistant integration for Poolside The Attendant"
readme = "README.md"
requires-python = ">=3.14.2"
license = "MIT"
authors = [{ name = "Poolside Home Assistant contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.14",
  "Topic :: Home Automation",
]

[project.optional-dependencies]
test = [
  "coverage[toml]==7.14.1",
  "homeassistant==2026.7.2",
  "mypy==2.3.0",
  "pytest==9.0.3",
  "pytest-cov==7.1.0",
  "pytest-homeassistant-custom-component==0.13.346",
  "ruff==0.15.22",
]

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "unit: isolated domain and protocol behavior",
  "integration: Home Assistant integration behavior with injected external resources",
  "e2e: full application behavior against isolated real services",
]

[tool.coverage.run]
branch = true
parallel = true
source = ["custom_components/poolside"]

[tool.coverage.report]
fail_under = 100
precision = 2
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN401",
  "COM812",
  "D203",
  "D213",
  "EM101",
  "EM102",
  "ISC001",
  "S105",
  "TC001",
  "TC002",
  "TC003",
  "TRY003",
  "TRY301",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "ANN",
  "ARG001",
  "D",
  "PLR2004",
  "PYI034",
  "S101",
  "S104",
  "SLF001",
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["pytest_homeassistant_custom_component.*"]
ignore_missing_imports = true
