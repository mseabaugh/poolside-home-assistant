title: Poolside
views:
  - title: Poolside
    path: poolside
    icon: mdi:pool
    type: sections
    max_columns: 3
    dense_section_placement: true
    sections:
      # The mode rail spans the desktop view. HA collapses sections to a
      # single column automatically on narrow tablet and phone displays.
      - type: grid
        column_span: 3
        cards:
          - type: custom:poolside-body-selector
            entity: select.poolside_active_body
            name: Active body
            grid_options:
              columns: full

      - type: grid
        title: Spa controls
        cards:
          # Use each entity only when it is discovered for this installation.
          - type: thermostat
            entity: climate.poolside_spa_heater
          - type: tile
            entity: fan.poolside_spa_blower
            features:
              - type: fan-speed
            vertical: false
          - type: tile
            entity: light.poolside_spa_lights
            features:
              - type: light-brightness
              - type: light-color-temp
            vertical: false
          - type: tile
            entity: switch.poolside_spa_jets
            vertical: false

      - type: grid
        title: Water and circulation
        cards:
          - type: tile
            entity: sensor.poolside_water_thermistor
            name: Water temperature
            icon: mdi:thermometer-water
            color: blue
          - type: tile
            entity: sensor.poolside_air_temperature
            name: Air temperature
            icon: mdi:thermometer
          - type: gauge
            entity: sensor.poolside_primary_pump_rpm
            name: Primary pump
            needle: true
            min: 0
            max: 3450
          - type: tile
            entity: sensor.poolside_primary_pump_speed_percent
            name: Circulation speed
            icon: mdi:fan

          - type: history-graph
            title: Water and chemistry — 24 hours
            hours_to_show: 24
            entities:
              - entity: sensor.poolside_water_thermistor
                name: Water temperature
              - entity: sensor.poolside_ph
                name: pH
              - entity: sensor.poolside_chlorine
                name: Chlorine
            grid_options:
              columns: full

      - type: grid
        title: Schedules
        cards:
          - type: calendar
            title: Schedules
            initial_view: listWeek
            entities:
              - calendar.poolside_schedule
            grid_options:
              columns: full
