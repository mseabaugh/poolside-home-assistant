<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 360" role="img" aria-labelledby="title desc">
  <title id="title">Poolside icon set</title>
  <desc id="desc">Pool, hot tub, fountain, and waterfall icons shown on Home Assistant style cards.</desc>
  <rect width="1220" height="360" rx="28" fill="#f4f7fa"/>
  <style>
    .card{fill:#fff;stroke:#d8dee5;stroke-width:2}.icon-bg{fill:#e1f3fb}.icon{fill:none;stroke:#1688bd;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}.label{font:600 24px system-ui,sans-serif;fill:#17212b}.hint{font:17px system-ui,sans-serif;fill:#65727e}
  </style>
  <g transform="translate(30 50)">
    <rect class="card" width="270" height="260" rx="24"/><circle class="icon-bg" cx="135" cy="104" r="62"/>
    <g class="icon" transform="translate(93 62) scale(1.32)"><ellipse cx="32" cy="39" rx="27" ry="15"/><ellipse cx="32" cy="39" rx="17" ry="6"/><path d="M40 34V16c0-4 7-4 7 0M50 34V16c0-4 7-4 7 0M40 23h10M40 30h10"/></g>
    <text class="label" x="135" y="195" text-anchor="middle">Pool</text><text class="hint" x="135" y="226" text-anchor="middle">Body of water</text>
  </g>
  <g transform="translate(325 50)">
    <rect class="card" width="270" height="260" rx="24"/><circle class="icon-bg" cx="135" cy="104" r="62"/>
    <g class="icon" transform="translate(93 62) scale(1.32)"><ellipse cx="32" cy="42" rx="27" ry="15"/><ellipse cx="32" cy="42" rx="17" ry="6"/><path d="M40 37V19c0-4 7-4 7 0M50 37V19c0-4 7-4 7 0M40 26h10M40 33h10"/><path d="M15 24c-4-4 4-7 0-12M26 22c-4-4 4-7 0-12M37 20c-4-4 4-7 0-12"/></g>
    <text class="label" x="135" y="195" text-anchor="middle">Hot tub</text><text class="hint" x="135" y="226" text-anchor="middle">Heated body</text>
  </g>
  <g transform="translate(620 50)">
    <rect class="card" width="270" height="260" rx="24"/><circle class="icon-bg" cx="135" cy="104" r="62"/>
    <g class="icon" transform="translate(93 62) scale(1.32)"><ellipse cx="32" cy="46" rx="27" ry="13"/><ellipse cx="32" cy="46" rx="14" ry="4"/><path d="M21 38V21c0-11 22-11 22 0v17"/><path d="M32 17v22"/></g>
    <text class="label" x="135" y="195" text-anchor="middle">Fountain</text><text class="hint" x="135" y="226" text-anchor="middle">Arcing water feature</text>
  </g>
  <g transform="translate(915 50)">
    <rect class="card" width="270" height="260" rx="24"/><circle class="icon-bg" cx="135" cy="104" r="62"/>
    <g class="icon" transform="translate(93 62) scale(1.32)"><path d="M14 8v27M26 8v27M38 8v27M50 8v27"/><path d="M7 41c4-3 8-3 12 0s8 3 12 0 8-3 12 0 8 3 14 0"/><path d="M7 50c4-3 8-3 12 0s8 3 12 0 8-3 12 0 8 3 14 0"/><path d="M7 59c4-3 8-3 12 0s8 3 12 0 8-3 12 0 8 3 14 0"/></g>
    <text class="label" x="135" y="195" text-anchor="middle">Waterfall</text><text class="hint" x="135" y="226" text-anchor="middle">Sheet or cascade</text>
  </g>
</svg>
