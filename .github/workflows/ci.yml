name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.14.6
          cache: pip
      - run: python -m pip install --editable '.[test]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy custom_components/poolside tests
      - run: pytest --cov=custom_components.poolside --cov-branch --cov-report=term-missing --cov-report=xml

  home-assistant-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master
      - uses: hacs/action@main
        with:
          category: integration

  local-container-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: docker compose config --quiet
      - run: ./scripts/e2e.sh
